     ELEMENTOR CUSTOM HTML — SECTION 2: HERO BANNER (PURE HTML/CSS/SVG)
     Atur Container Elementor: Full Width, Padding 0.
     Ganti URL gambar dengan URL Media Library WordPress jika perlu.
     ========================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Rubik:wght@800;900&display=swap" rel="stylesheet" />

<style>
  .rmm-hero-section * {
    box-sizing: border-box;
  }

  .rmm-hero-section {
    background: #894821 url("https://raw.githubusercontent.com/htzaml-01/mamaji/main/Asset/hero-bowl-bg.jpg") no-repeat 74% 48% / cover;
    position: relative;
    overflow: hidden;
    width: 100%;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  }

  .rmm-hero-section a {
    text-decoration: none;
  }

  .rmm-hero-inner {
    width: min(1320px, 92%);
    margin: 0 auto;
    min-height: clamp(500px, 43vw, 620px);
    padding: 36px 0 38px;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    align-items: stretch;
    position: relative;
    z-index: 2;
  }

  .rmm-hero-left {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    padding-top: 10px;
  }

  .rmm-hero-flower {
    position: absolute;
    pointer-events: none;
    z-index: 1;
  }

  .rmm-hero-flower--tl {
    width: clamp(105px, 11.5vw, 162px);
    top: -16px;
    left: -26px;
  }

  .rmm-hero-flower--mid {
    width: clamp(110px, 12vw, 168px);
    bottom: -36px;
    right: -34px;
  }

  .rmm-hero-flower--dark {
    position: relative;
    width: clamp(92px, 9.5vw, 134px);
    margin: 12px 0 10px 8px;
  }

  .rmm-hero-flower--tr {
    width: clamp(110px, 11.5vw, 162px);
    top: 28px;
    right: -12px;
    z-index: 0;
  }

  .rmm-hero-headline-wrap {
    position: relative;
    width: fit-content;
    max-width: 100%;
    z-index: 2;
    margin-left: clamp(16px, 2.2vw, 34px);
    padding-top: 18px;
  }

  .rmm-hero-pill {
    position: absolute;
    top: 6px;
    right: -14px;
    transform: rotate(-8deg);
    background-color: #F9D849;
    color: #3A1912;
    border: 1.5px solid #3A1912;
    border-radius: 999px;
    padding: 6px 18px;
    font-size: clamp(11.5px, 1.05vw, 15px);
    font-weight: 800;
    letter-spacing: 0.03em;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(58, 25, 18, 0.16);
    z-index: 3;
  }

  .rmm-hero-title {
    position: relative;
    z-index: 2;
    font-family: 'Rubik', 'DM Sans', sans-serif;
    font-weight: 900;
    font-size: clamp(46px, 6vw, 84px);
    line-height: 0.85;
    letter-spacing: -0.045em;
    color: #3A1912;
    margin: 0;
    text-transform: uppercase;
  }

  .rmm-hero-cta {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    padding-left: clamp(6px, 1vw, 14px);
  }

  .rmm-hero-order-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background-color: #F9D849;
    color: #3A1912;
    border-radius: 999px;
    padding: 10px 28px;
    font-size: clamp(14px, 1.15vw, 17px);
    font-weight: 900;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    box-shadow: 0 8px 20px rgba(58, 25, 18, 0.2);
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .rmm-hero-order-btn:hover {
    background-color: #FFE469;
    transform: translateY(-2px);
  }

  .rmm-hero-brand-sub {
    font-size: clamp(14px, 1.15vw, 17px);
    font-weight: 800;
    color: #3A1912;
    padding-left: 2px;
  }

  .rmm-hero-right {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
  }

  .rmm-hero-mobile-bowl {
    display: none;
  }

  .rmm-hero-tagline {
    position: relative;
    z-index: 2;
    margin: 0;
    text-align: left;
    font-size: clamp(11.5px, 0.96vw, 14px);
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: 0.02em;
    color: #3A1912;
    text-transform: uppercase;
  }

  .rmm-hero-notch {
    position: absolute;
    left: 50%;
    bottom: -1px;
    transform: translateX(-50%);
    width: 44px;
    height: 24px;
    background-color: #FDF3E3;
    border-radius: 999px 999px 0 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 2px;
    color: #3A1912;
    z-index: 5;
    transition: transform 0.2s ease;
  }

  .rmm-hero-notch svg {
    width: 16px;
    height: 16px;
  }

  .rmm-hero-notch:hover {
    transform: translateX(-50%) translateY(-2px);
  }

  @media (max-width: 768px) {
    .rmm-hero-section {
      background-image: none;
      background: radial-gradient(circle at 50% 45%, #9B5429 0%, #83421D 100%);
    }

    .rmm-hero-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: auto;
      padding: 30px 0 42px;
      gap: 20px;
    }

    .rmm-hero-left,
    .rmm-hero-right {
      display: contents;
    }

    .rmm-hero-headline-wrap {
      order: 1;
      margin: 6px auto 0;
      padding: 16px 14px 4px;
      text-align: center;
    }

    .rmm-hero-title {
      font-size: clamp(40px, 12.2vw, 58px);
    }

    .rmm-hero-flower--tl {
      width: 84px;
      left: -14px;
      top: -10px;
    }

    .rmm-hero-flower--mid {
      width: 86px;
      right: -14px;
      bottom: -20px;
    }

    .rmm-hero-flower--dark,
    .rmm-hero-flower--tr {
      display: none;
    }

    .rmm-hero-pill {
      right: -6px;
      top: -4px;
      padding: 4px 12px;
      font-size: 11px;
    }

    .rmm-hero-mobile-bowl {
      order: 2;
      display: block;
      width: min(300px, 82%);
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      border: 4px solid #F9D849;
      box-shadow: 0 18px 36px rgba(58, 25, 18, 0.34);
      object-fit: cover;
    }

    .rmm-hero-cta {
      order: 3;
      align-items: center;
      text-align: center;
      padding-left: 0;
      margin-top: 2px;
    }

    .rmm-hero-order-btn {
      padding: 12px 34px;
      font-size: 15px;
    }

    .rmm-hero-tagline {
      order: 4;
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
      max-width: 300px;
    }

    .rmm-hero-notch {
      width: 36px;
      height: 19px;
    }
  }
</style>
