<!-- =========================================================
     ELEMENTOR CUSTOM HTML — SECTION 2: HERO BANNER
     Atur Container Elementor: Full Width, Padding 0.
     Ganti URL src gambar dengan URL Media Library WordPress jika perlu.
     ========================================================= -->
<style>
  .rmm-hero-section * {
    box-sizing: border-box;
  }

  .rmm-hero-section {
    background-color: #894821;
    position: relative;
    padding: 0;
    width: 100%;
  }

  .rmm-hero-media-frame {
    position: relative;
    width: 100%;
    max-width: none;
    margin: 0;
  }

  .rmm-hero-asset-img {
    width: 100%;
    height: auto;
    display: block;
  }

  .rmm-hero-order-hotspot {
    position: absolute;
    left: 5%;
    bottom: 10%;
    width: 13.2%;
    height: 7.5%;
    border-radius: 999px;
    z-index: 4;
    transition: box-shadow 0.25s ease, transform 0.2s ease;
  }

  .rmm-hero-order-hotspot:hover {
    box-shadow: 0 0 0 3px rgba(248, 214, 74, 0.55), 0 10px 24px rgba(58, 25, 18, 0.35);
    transform: translateY(-2px);
  }

  .rmm-hero-notch {
    position: absolute;
    left: 50%;
    bottom: -1px;
    transform: translateX(-50%);
    width: 44px;
    height: 24px;
    background-color: #FDF3E3;
    border-radius: 999px 999px 0 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 2px;
    color: #3A1912;
    text-decoration: none;
    z-index: 5;
    transition: transform 0.2s ease;
  }

  .rmm-hero-notch svg {
    width: 16px;
    height: 16px;
  }

  .rmm-hero-notch:hover {
    transform: translateX(-50%) translateY(-2px);
  }

  @media (max-width: 680px) {
    .rmm-hero-section {
      padding: 0;
    }

    .rmm-hero-media-frame {
      max-width: none;
    }

    .rmm-hero-asset-img {
      width: 100%;
      height: auto;
    }

    .rmm-hero-notch {
      width: 36px;
      height: 19px;
    }
  }
</style>

<section class="rmm-hero-section" aria-label="Banner Utama Rendang Mamaji">
  <div class="rmm-hero-media-frame">
    <img
      src="https://raw.githubusercontent.com/htzaml-01/mamaji/main/Asset/hero-the-best-instan-rendang.jpg"
      alt="Rendang Mamaji — The Best Instan Rendang. Bold Aroma, Spicy Kick, Unforgettable Taste."
      class="rmm-hero-asset-img"
    />
    <a
      href="#pengiriman"
      class="rmm-hero-order-hotspot"
      aria-label="Order Now — Pesan Rendang Mamaji"
      title="Klik untuk pesan Rendang Mamaji"
    ></a>
  </div>

  <a href="#cerita" class="rmm-hero-notch" aria-label="Gulir ke bagian berikutnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 10l5 5 5-5" />
    </svg>
  </a>
</section>
