<!-- =========================================================
     ELEMENTOR CUSTOM HTML — SECTION 2: HERO BANNER
     Atur Container Elementor: Full Width, Padding 0.
     Ganti URL src gambar dengan URL Media Library WordPress jika perlu.
     ========================================================= -->
<style>
  .rmm-hero-section * {
    box-sizing: border-box;
  }

  .rmm-hero-section {
    background: radial-gradient(circle at 55% 45%, #9A5228 0%, #83421D 100%);
    position: relative;
    padding: 10px 0 18px;
    width: 100%;
  }

  .rmm-hero-media-frame {
    position: relative;
    width: fit-content;
    max-width: min(980px, 96%);
    margin: 0 auto;
    overflow: hidden;
    border-radius: 14px;
    mask-image: linear-gradient(90deg, transparent 0%, #000 3.5%, #000 96.5%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 3.5%, #000 96.5%, transparent 100%);
  }

  .rmm-hero-asset-img {
    width: auto;
    max-width: 100%;
    max-height: 54vh;
    height: auto;
    display: block;
  }

  .rmm-hero-order-hotspot {
    position: absolute;
    left: 5.5%;
    bottom: 9.8%;
    width: 13.8%;
    height: 6.2%;
    border-radius: 999px;
    z-index: 4;
    transition: box-shadow 0.25s ease, transform 0.2s ease;
  }

  .rmm-hero-order-hotspot:hover {
    box-shadow: 0 0 0 3px rgba(248, 214, 74, 0.55), 0 10px 24px rgba(58, 25, 18, 0.35);
    transform: translateY(-2px);
  }

  .rmm-hero-notch {
    position: absolute;
    left: 50%;
    bottom: -1px;
    transform: translateX(-50%);
    width: 44px;
    height: 24px;
    background-color: #FDF3E3;
    border-radius: 999px 999px 0 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 2px;
    color: #3A1912;
    text-decoration: none;
    z-index: 5;
    transition: transform 0.2s ease;
  }

  .rmm-hero-notch svg {
    width: 16px;
    height: 16px;
  }

  .rmm-hero-notch:hover {
    transform: translateX(-50%) translateY(-2px);
  }

  @media (max-width: 680px) {
    .rmm-hero-section {
      padding: 0;
    }

    .rmm-hero-media-frame {
      max-width: 100%;
      border-radius: 0;
      mask-image: none;
      -webkit-mask-image: none;
    }

    .rmm-hero-asset-img {
      width: 100%;
      max-height: none;
    }

    .rmm-hero-notch {
      width: 36px;
      height: 19px;
    }
  }
</style>

<section class="rmm-hero-section" aria-label="Banner Utama Rendang Mamaji">
  <div class="rmm-hero-media-frame">
    <img
      src="https://raw.githubusercontent.com/htzaml-01/mamaji/main/Asset/Gemini_Generated_Image_iqyycoiqyycoiqyy%20(1).jpeg"
      alt="Rendang Mamaji — Try, Definitely Return. Bold Aroma, Spicy Kick, Unforgettable Taste."
      class="rmm-hero-asset-img"
    />
    <a
      href="#pengiriman"
      class="rmm-hero-order-hotspot"
      aria-label="Order Now — Pesan Rendang Mamaji"
      title="Klik untuk pesan Rendang Mamaji"
    ></a>
  </div>

  <a href="#cerita" class="rmm-hero-notch" aria-label="Gulir ke bagian berikutnya">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M7 10l5 5 5-5" />
    </svg>
  </a>
</section>
