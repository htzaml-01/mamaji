<!-- =========================================================
     ELEMENTOR CUSTOM HTML — SECTION 1: HEADER & NAVBAR
     Tempelkan ke widget HTML di bagian paling atas halaman
     (atau di Elementor Theme Builder -> Header).
     Atur Container Elementor: Full Width, Padding 0.
     ========================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

<style>
  .rmm-header-wrap * {
    box-sizing: border-box;
  }

  .rmm-header-wrap {
    position: sticky;
    top: 0;
    z-index: 999;
    background-color: #F8D64A;
    border-bottom: 1px solid rgba(58, 25, 18, 0.08);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    color: #3A1912;
    transition: box-shadow 0.25s ease;
  }

  .rmm-header-wrap.is-scrolled {
    box-shadow: 0 6px 24px rgba(58, 25, 18, 0.1);
  }

  .rmm-header-wrap a {
    color: inherit;
    text-decoration: none;
  }

  .rmm-navbar {
    width: min(1320px, 95%);
    margin: 0 auto;
    height: 56px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }

  .rmm-nav-group {
    display: flex;
    align-items: center;
    gap: 28px;
  }

  .rmm-nav-left {
    justify-content: flex-start;
  }

  .rmm-nav-right {
    justify-content: flex-end;
  }

  .rmm-nav-link {
    font-family: 'Space Mono', ui-monospace, monospace;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: #3A1912;
    position: relative;
    padding: 4px 0;
  }

  .rmm-nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 1.5px;
    background-color: #3A1912;
    transition: width 0.22s ease;
  }

  .rmm-nav-link:hover::after {
    width: 100%;
  }

  .rmm-brand-logo {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #3A1912;
    justify-self: center;
  }

  .rmm-brand-starburst {
    width: 24px;
    height: 24px;
    transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .rmm-brand-logo:hover .rmm-brand-starburst {
    transform: rotate(45deg);
  }

  .rmm-brand-wordmark {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .rmm-mobile-controls {
    display: none;
    align-items: center;
    justify-self: end;
  }

  .rmm-menu-toggle {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(58, 25, 18, 0.22);
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0;
    cursor: pointer;
  }

  .rmm-menu-toggle span {
    width: 16px;
    height: 2px;
    background-color: #3A1912;
    border-radius: 2px;
  }

  .rmm-mobile-nav {
    background-color: #F8D64A;
    border-top: 1px solid rgba(58, 25, 18, 0.1);
    padding: 14px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .rmm-mobile-nav[hidden] {
    display: none;
  }

  .rmm-mobile-nav-link {
    font-family: 'Space Mono', ui-monospace, monospace;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 6px 0;
    border-bottom: 1px dashed rgba(58, 25, 18, 0.15);
  }

  @media (max-width: 980px) {
    .rmm-nav-group {
      display: none;
    }

    .rmm-navbar {
      grid-template-columns: auto 1fr;
    }

    .rmm-brand-logo {
      justify-self: start;
    }

    .rmm-mobile-controls {
      display: flex;
    }
  }
</style>

<header class="rmm-header-wrap" id="rmmTop">
  <nav class="rmm-navbar" aria-label="Navigasi Utama">
    <div class="rmm-nav-group rmm-nav-left">
      <a href="#cerita" class="rmm-nav-link">CERITA KAMI</a>
      <a href="#paket" class="rmm-nav-link">KEMASAN</a>
      <a href="#galeri" class="rmm-nav-link">KEUNGGULAN</a>
    </div>

    <a href="#rmmTop" class="rmm-brand-logo" aria-label="Rendang Mamaji Beranda">
      <svg class="rmm-brand-starburst" viewBox="0 0 64 64" fill="currentColor" aria-hidden="true">
        <g transform="translate(32,32)">
          <ellipse rx="4.2" ry="18" transform="rotate(0) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(32.7) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(65.4) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(98.1) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(130.9) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(163.6) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(196.3) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(229) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(261.8) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(294.5) translate(0,-11)" />
          <ellipse rx="4.2" ry="18" transform="rotate(327.2) translate(0,-11)" />
        </g>
      </svg>
      <span class="rmm-brand-wordmark">Mamaji</span>
    </a>

    <div class="rmm-nav-group rmm-nav-right">
      <a href="#kemitraan" class="rmm-nav-link">KEMITRAAN</a>
      <a href="#pengiriman" class="rmm-nav-link">PESAN ANTAR</a>
      <a href="#lokasi" class="rmm-nav-link">LOKASI</a>
    </div>

    <div class="rmm-mobile-controls">
      <button type="button" class="rmm-menu-toggle" id="rmmMobileToggle" aria-expanded="false" aria-label="Toggle menu navigasi">
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="rmm-mobile-nav" id="rmmMobileNav" hidden>
    <a href="#cerita" class="rmm-mobile-nav-link">Cerita Kami</a>
    <a href="#paket" class="rmm-mobile-nav-link">Kemasan Vacuum</a>
    <a href="#galeri" class="rmm-mobile-nav-link">Keunggulan</a>
    <a href="#kemitraan" class="rmm-mobile-nav-link">Kemitraan &amp; Hampers</a>
    <a href="#lokasi" class="rmm-mobile-nav-link">Lokasi Dapur</a>
  </div>
</header>

<script>
  (function () {
    const header = document.getElementById('rmmTop');
    const toggle = document.getElementById('rmmMobileToggle');
    const nav = document.getElementById('rmmMobileNav');

    if (toggle && nav) {
      toggle.addEventListener('click', function () {
        const isHidden = nav.hidden;
        nav.hidden = !isHidden;
        toggle.setAttribute('aria-expanded', String(isHidden));
      });
      nav.querySelectorAll('a').forEach(function (link) {
        link.addEventListener('click', function () {
          nav.hidden = true;
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    }

    window.addEventListener(
      'scroll',
      function () {
        if (header) header.classList.toggle('is-scrolled', window.scrollY > 12);
      },
      { passive: true }
    );
  })();
</script>
